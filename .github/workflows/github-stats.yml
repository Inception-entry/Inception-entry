name: Update GitHub Stats

on:
  schedule:
    # 每天自动执行一次，UTC 03:00
    - cron: "0 3 * * *"

  # 允许你在 GitHub Actions 页面手动执行
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # 必须有写权限，否则生成后无法提交 SVG
    permissions:
      contents: write

    steps:
      # 1. 拉取你的个人主页仓库
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. 获取 GitHub 数据并生成 SVG
      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Inception-entry&show_icons=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 3. 把生成的 SVG 提交回仓库
      - name: Commit SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg
          git commit -m "chore: update GitHub stats" || exit 0
          git push
